url: https://tony2015116.github.io/mintyr/

template:
  #bootstrap: 5
  bootswatch: cosmo
  theme: arrow-dark            # syntax highlighting of code blocks

home:
  title: "mintyr: Grouped and Nested Data Pipelines Built on data.table"
  description: >
    Import many Excel / CSV files, reshape and nest data by trait and group,
    cross-validate and summarise every group, and write each piece back to
    its own file - fast, with data.table.

navbar:
  structure:
    left:  [intro, reference, articles, news]
    right: [search, github, discussions]
  components:
    github:
      icon: fab fa-github fa-lg
      href: https://github.com/tony2015116/mintyr
      aria-label: GitHub
    discussions:
      icon: fas fa-users fa-lg
      href: https://github.com/tony2015116/mintyr/discussions
      aria-label: Discussions

# Articles: one per function family (generated by the flat files in dev/);
# vignettes/mintyr.Rmd is the "Get started" page.
articles:
- title: Workflows
  navbar: ~
  contents:
  - import-and-export
  - reshape-and-nest
  - cross-validation
  - descriptive-statistics
  - utilities

reference:
- title: Import and export
  desc: >
    Read many files and sheets into one table, write the pieces back to
    files, folders or workbooks.
  contents:
  - import_xlsx
  - import_csv
  - export_xlsx
  - export_nest
  - export_list
- title: Reshape and nest
  desc: >
    Wide to long, nested or split by trait and group; pairs of traits;
    levels of a column side by side.
  contents:
  - w2l_nest
  - w2l_split
  - c2p_nest
  - r2p_nest
- title: Cross-validation
  desc: Repeated, stratified k-fold cross-validation within every group.
  contents:
  - split_cv
  - nest_cv
- title: Descriptive statistics
  desc: Group summaries, totals, report-ready text and top / bottom X%.
  contents:
  - desc_stats
  - top_perc
  - format_digits
- title: Utilities
  contents:
  - get_path_info
- title: Example data
  contents:
  - mintyr_example
  - mintyr_examples

news:
  cran_dates: false
